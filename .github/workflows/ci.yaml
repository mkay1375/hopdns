name: Verify and optionally publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified AMD64 and ARM64 images to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Build local image
        run: docker compose -f compose.yaml -f compose.build.yaml build
      - name: Offline DNS and proxy integration
        run: python3 tests/integration_smoke.py --image hopdns:local
      - name: Browser smoke and theme checks
        run: |
          mkdir -p /tmp/hopdns-screenshots
          docker run -d --name hopdns-ui --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /run/hopdns:uid=10001,gid=10001,mode=700 \
            --tmpfs /tmp hopdns:local
          trap 'docker rm -f hopdns-ui' EXIT
          for attempt in $(seq 1 30); do
            if docker exec hopdns-ui python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=1).read()" 2>/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs hopdns-ui; exit 1; fi
            sleep 1
          done
          docker run --rm --network container:hopdns-ui --entrypoint node \
            -v "$PWD/tests/ui_smoke.cjs:/test.cjs:ro" \
            -v /tmp/hopdns-screenshots:/artifacts \
            mcr.microsoft.com/playwright/mcp:v0.0.83 /test.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: panel-screenshots
          path: /tmp/hopdns-screenshots
          if-no-files-found: ignore

  publish:
    needs: test
    # A push, tag, or PR never publishes. A maintainer must explicitly opt in.
    name: Publish multi-architecture image to GHCR
    if: >-
      github.repository == 'mkay1375/hopdns' &&
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long
          flavor: latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
